<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IKDA Live Meeting</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #111c33;
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #263552;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 6px 0 0;
      color: #aebbd3;
    }

    .container {
      width: 92%;
      max-width: 700px;
      margin: 25px auto;
    }

    .card {
      background: #111c33;
      border: 1px solid #263552;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .room {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .status {
      color: #aebbd3;
      margin-bottom: 20px;
    }

    .mic {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      background: #34445f;
      color: white;
      font-size: 42px;
      display: block;
      margin: 25px auto;
      cursor: pointer;
    }

    .mic.live {
      background: #d32f2f;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button.action {
      border: none;
      padding: 14px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    #joinBtn {
      background: #1976d2;
      color: white;
    }

    #leaveBtn {
      background: #d32f2f;
      color: white;
    }

    .participants {
      margin-top: 20px;
    }

    .participant {
      background: #182640;
      padding: 12px;
      border-radius: 10px;
      margin-top: 8px;
    }

    .speaker {
      color: #4caf50;
      font-weight: bold;
    }

    #error {
      display: none;
      background: #3b1717;
      border: 1px solid #8d3333;
      color: #ffb3b3;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>IKDA LIVE</h1>
  <p>Igala Kingdom Descendants Association</p>
</header>

<div class="container">

  <div class="card">

    <div class="room">
      Meeting Code:
      <span id="roomName">Loading...</span>
    </div>

    <div class="status" id="status">
      Ready to join.
    </div>

    <button
      id="micBtn"
      class="mic"
      title="Microphone"
    >
      🎙️
    </button>

    <div class="buttons">

      <button
        id="joinBtn"
        class="action"
      >
        Join Audio
      </button>

      <button
        id="leaveBtn"
        class="action"
      >
        Leave Meeting
      </button>

    </div>

    <div id="error"></div>

  </div>

  <div class="card">

    <h3>Participants</h3>

    <div id="participants">
      No participants connected yet.
    </div>

  </div>

</div>

<script type="module">

import {
  Room,
  RoomEvent,
  Track
} from "https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.esm.mjs";


const SUPABASE_URL =
  "https://dvskuudjamineqbvvjld.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_r8v8E93qy_DpvNhL9pvyKQ_HZBLaBm5";

const LIVEKIT_URL =
  "wss://ikda-live-fixk0pvi.livekit.cloud";


const roomNameElement =
  document.getElementById("roomName");

const statusElement =
  document.getElementById("status");

const micBtn =
  document.getElementById("micBtn");

const joinBtn =
  document.getElementById("joinBtn");

const leaveBtn =
  document.getElementById("leaveBtn");

const participantsElement =
  document.getElementById("participants");

const errorElement =
  document.getElementById("error");


const params =
  new URLSearchParams(window.location.search);

const roomName =
  params.get("room") ||
  localStorage.getItem("ikdaMeetingCode") ||
  "IKDA-LIVE";

const participantName =
  localStorage.getItem("ikdaParticipantName") ||
  "IKDA Participant";

roomNameElement.textContent =
  roomName;


const room = new Room({
  adaptiveStream: true,
  dynacast: true
});

let joined = false;
let microphoneOn = false;


function showError(message) {

  errorElement.style.display =
    "block";

  errorElement.textContent =
    message;

}


async function getToken() {

  const response = await fetch(
    `${SUPABASE_URL}/functions/v1/livekit-token`,
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_PUBLISHABLE_KEY,
        "Authorization":
          `Bearer ${SUPABASE_PUBLISHABLE_KEY}`
      },

      body: JSON.stringify({
        roomName: roomName,
        participantName: participantName
      })
    }
  );

  const data =
    await response.json();

  if (!response.ok) {

    throw new Error(
      data.error ||
      "Unable to obtain meeting token."
    );

  }

  return data.token;
}


function updateParticipants() {

  const remoteParticipants =
    Array.from(
      room.remoteParticipants.values()
    );

  participantsElement.innerHTML = "";

  const localDiv =
    document.createElement("div");

  localDiv.className =
    "participant";

  localDiv.innerHTML =
    `<strong>${participantName}</strong>
     <span class="speaker"> — You</span>`;

  participantsElement.appendChild(
    localDiv
  );


  remoteParticipants.forEach(
    participant => {

      const div =
        document.createElement("div");

      div.className =
        "participant";

      div.textContent =
        participant.name ||
        participant.identity;

      participantsElement.appendChild(
        div
      );

    }
  );

}


async function joinMeeting() {

  try {

    errorElement.style.display =
      "none";

    statusElement.textContent =
      "Getting secure meeting access...";

    const token =
      await getToken();

    statusElement.textContent =
      "Connecting to IKDA Live...";

    await room.connect(
      LIVEKIT_URL,
      token
    );

    joined = true;

    /*
      IMPORTANT:
      Everyone starts muted.
    */

    await room.localParticipant
      .setMicrophoneEnabled(false);

    microphoneOn = false;

    micBtn.classList.remove("live");

    statusElement.textContent =
      "Connected — microphone is muted.";

    joinBtn.style.display =
      "none";

    updateParticipants();

  } catch (error) {

    console.error(error);

    statusElement.textContent =
      "Connection failed.";

    showError(
      error.message ||
      "Unable to join the meeting."
    );

  }

}


micBtn.addEventListener(
  "click",
  async () => {

    if (!joined) {

      showError(
        "Join the meeting first."
      );

      return;

    }

    microphoneOn =
      !microphoneOn;

    await room.localParticipant
      .setMicrophoneEnabled(
        microphoneOn
      );

    if (microphoneOn) {

      micBtn.classList.add("live");

      statusElement.textContent =
        "Your microphone is LIVE.";

    } else {

      micBtn.classList.remove("live");

      statusElement.textContent =
        "Your microphone is muted.";

    }

  }
);


room.on(
  RoomEvent.ParticipantConnected,
  () => {

    updateParticipants();

  }
);


room.on(
  RoomEvent.ParticipantDisconnected,
  () => {

    updateParticipants();

  }
);


room.on(
  RoomEvent.TrackSubscribed,
  (
    track,
    publication,
    participant
  ) => {

    if (
      track.kind === Track.Kind.Audio
    ) {

      const audioElement =
        track.attach();

      audioElement.autoplay =
        true;

      document.body.appendChild(
        audioElement
      );

    }

  }
);


room.on(
  RoomEvent.Disconnected,
  () => {

    joined = false;

    microphoneOn = false;

    statusElement.textContent =
      "You have left the meeting.";

    joinBtn.style.display =
      "inline-block";

    updateParticipants();

  }
);


joinBtn.addEventListener(
  "click",
  joinMeeting
);


leaveBtn.addEventListener(
  "click",
  async () => {

    if (joined) {

      await room.disconnect();

    }

    window.location.href =
      "index.html";

  }
);

</script>

</body>
</html>
