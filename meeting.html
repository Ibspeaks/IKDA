<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IKDA Live Meeting</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #061b14, #0b3d2e);
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: rgba(0,0,0,0.3);
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    header h1 {
      color: #ffd700;
      font-size: 28px;
    }

    header p {
      color: #ccc;
      margin-top: 5px;
    }

    .container {
      width: 94%;
      max-width: 800px;
      margin: 25px auto;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .meeting-info {
      text-align: center;
    }

    .meeting-info h2 {
      color: #ffd700;
      margin-bottom: 10px;
    }

    .meeting-code {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 18px;
      border: 1px solid #ffd700;
      border-radius: 10px;
      color: #ffd700;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .status {
      margin-top: 15px;
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      background: #16a085;
      font-size: 13px;
    }

    .participants {
      margin-top: 20px;
    }

    .participants h3 {
      color: #ffd700;
      margin-bottom: 12px;
    }

    .participant {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0,0,0,0.25);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #ffd700;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .participant-info strong {
      display: block;
    }

    .participant-info span {
      color: #aaa;
      font-size: 13px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .mic {
      background: #16a085;
      color: white;
    }

    .muted {
      background: #e74c3c;
      color: white;
    }

    .leave {
      background: #b71c1c;
      color: white;
    }

    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      text-align: center;
      display: none;
    }

    audio {
      display: none;
    }

    @media (max-width: 600px) {
      .controls button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>IKDA LIVE</h1>
  <p>Igala Kingdom Descendants Association</p>
</header>


<div class="container">

  <div class="card meeting-info">

    <h2>Live Audio Meeting</h2>

    <p id="welcomeText">
      Connecting to meeting...
    </p>

    <div class="meeting-code" id="meetingCode">
      ------
    </div>

    <br>

    <span class="status" id="connectionStatus">
      Connecting...
    </span>

  </div>


  <div class="card">

    <div class="participants">

      <h3>Participants</h3>

      <div id="participantsList">

        <div class="participant">

          <div class="avatar" id="myAvatar">
            ME
          </div>

          <div class="participant-info">

            <strong id="myName">
              You
            </strong>

            <span id="myStatus">
              Connecting microphone...
            </span>

          </div>

        </div>

      </div>

    </div>


    <div class="controls">

      <button
        class="mic"
        id="micButton"
        onclick="toggleMicrophone()">
        🎤 Mute Microphone
      </button>

      <button
        class="leave"
        onclick="leaveMeeting()">
        🚪 Leave Meeting
      </button>

    </div>


    <div class="message" id="message">
    </div>

  </div>

</div>


<!-- Remote audio players will be added here -->

<div id="audioContainer"></div>


<script>

  /*
  =====================================================
  GET MEETING INFORMATION
  =====================================================
  */

  const params =
    new URLSearchParams(window.location.search);

  const meetingCode =
    params.get("room") ||
    localStorage.getItem("ikdaMeetingCode") ||
    "IKDA";


  const participantName =
    localStorage.getItem("ikdaParticipantName") ||
    "Participant";


  /*
  =====================================================
  DISPLAY INFORMATION
  =====================================================
  */

  document.getElementById("meetingCode")
    .textContent =
    meetingCode;


  document.getElementById("myName")
    .textContent =
    participantName;


  document.getElementById("welcomeText")
    .textContent =
    "Welcome, " + participantName;


  /*
  =====================================================
  AVATAR
  =====================================================
  */

  const firstLetter =
    participantName
      .charAt(0)
      .toUpperCase();


  document.getElementById("myAvatar")
    .textContent =
    firstLetter;


  /*
  =====================================================
  WEBRTC VARIABLES
  =====================================================
  */

  let localStream = null;

  let microphoneEnabled = false;

  let peerConnections = {};


  /*
  =====================================================
  WEBRTC CONFIGURATION
  =====================================================
  */

  const rtcConfiguration = {

    iceServers: [

      {
        urls: "stun:stun.l.google.com:19302"
      },

      {
        urls: "stun:stun1.l.google.com:19302"
      }

    ]

  };


  /*
  =====================================================
  GET MICROPHONE
  =====================================================
  */

  async function startMicrophone() {

    try {

      localStream =
        await navigator.mediaDevices.getUserMedia({

          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },

          video: false

        });


      microphoneEnabled = true;


      document.getElementById("myStatus")
        .textContent =
        "Microphone connected";


      document.getElementById("connectionStatus")
        .textContent =
        "Connected";


      showMessage(
        "Microphone connected successfully."
      );


    } catch (error) {

      console.error(
        "Microphone error:",
        error
      );


      document.getElementById("myStatus")
        .textContent =
        "Microphone unavailable";


      showMessage(
        "Please allow microphone permission in your browser."
      );

    }

  }


  /*
  =====================================================
  MUTE / UNMUTE
  =====================================================
  */

  function toggleMicrophone() {

    if (!localStream) {

      startMicrophone();

      return;

    }


    const tracks =
      localStream.getAudioTracks();


    if (tracks.length === 0) {

      return;

    }


    microphoneEnabled =
      !microphoneEnabled;


    tracks.forEach(
      track => {

        track.enabled =
          microphoneEnabled;

      }
    );


    const button =
      document.getElementById("micButton");


    if (microphoneEnabled) {

      button.textContent =
        "🎤 Mute Microphone";

      button.className =
        "mic";

      document.getElementById("myStatus")
        .textContent =
        "Microphone on";

    } else {

      button.textContent =
        "🔇 Unmute Microphone";

      button.className =
        "muted";

      document.getElementById("myStatus")
        .textContent =
        "Microphone muted";

    }

  }


  /*
  =====================================================
  CREATE PEER CONNECTION
  =====================================================
  */

  function createPeerConnection(participantId) {

    const peerConnection =
      new RTCPeerConnection(
        rtcConfiguration
      );


    if (localStream) {

      localStream
        .getTracks()
        .forEach(
          track => {

            peerConnection.addTrack(
              track,
              localStream
            );

          }
        );

    }


    /*
    RECEIVE REMOTE AUDIO
    */

    peerConnection.ontrack =
      function(event) {

        let audio =
          document.getElementById(
            "audio-" + participantId
          );


        if (!audio) {

          audio =
            document.createElement(
              "audio"
            );

          audio.id =
            "audio-" + participantId;

          audio.autoplay = true;

          audio.controls = false;

          document
            .getElementById(
              "audioContainer"
            )
            .appendChild(audio);

        }


        audio.srcObject =
          event.streams[0];

      };


    /*
    ICE CANDIDATES
    */

    peerConnection.onicecandidate =
      function(event) {

        if (event.candidate) {

          /*
          Supabase signaling will send
          this candidate to the other participant.
          */

          console.log(
            "ICE candidate:",
            event.candidate
          );

        }

      };


    peerConnections[
      participantId
    ] =
      peerConnection;


    return peerConnection;

  }


  /*
  =====================================================
  LEAVE MEETING
  =====================================================
  */

  function leaveMeeting() {

    if (localStream) {

      localStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    Object.values(
      peerConnections
    ).forEach(
      connection =>
        connection.close()
    );


    peerConnections = {};


    window.location.href =
      "index.html";

  }


  /*
  =====================================================
  MESSAGE
  =====================================================
  */

  function showMessage(message) {

    const element =
      document.getElementById(
        "message"
      );

    element.textContent =
      message;

    element.style.display =
      "block";


    setTimeout(
      function() {

        element.style.display =
          "none";

      },
      4000
    );

  }


  /*
  =====================================================
  START
  =====================================================
  */

  startMicrophone();

</script>

</body>
</html>
