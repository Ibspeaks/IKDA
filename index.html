<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IKDA Live</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #061b14, #0b3d2e);
      color: white;
    }

    header {
      text-align: center;
      padding: 25px 15px;
      background: rgba(0,0,0,0.3);
    }

    header h1 {
      color: #ffd700;
      font-size: 32px;
    }

    header p {
      margin-top: 6px;
      color: #ddd;
    }

    .container {
      width: 92%;
      max-width: 600px;
      margin: 35px auto;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .card h2 {
      text-align: center;
      color: #ffd700;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      margin-top: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .join {
      background: #ffd700;
      color: #111;
    }

    .create {
      background: #16a085;
      color: white;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
      text-align: center;
    }

    .info {
      text-align: center;
      margin-top: 25px;
      color: #bbb;
      font-size: 14px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      color: #999;
      padding: 25px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>IKDA LIVE</h1>
  <p>Igala Kingdom Descendants Association</p>
</header>

<div class="container">

  <div class="card">

    <h2>Join Live Audio Meeting</h2>

    <input
      type="text"
      id="participantName"
      placeholder="Enter your full name"
      autocomplete="name"
    >

    <input
      type="text"
      id="meetingCode"
      placeholder="Enter meeting code"
      autocomplete="off"
    >

    <button
      class="join"
      onclick="joinMeeting()">
      🎙️ Join Meeting
    </button>

    <button
      class="create"
      onclick="createMeeting()">
      ➕ Create New Meeting
    </button>

    <div
      class="message"
      id="loginMessage">
    </div>

    <div class="info">
      Enter your name and meeting code to join an
      IKDA Live audio meeting.
      <br><br>
      Your microphone will be requested when you
      enter the meeting.
    </div>

  </div>

</div>

<footer>
  © 2026 IKDA Live — Igala Kingdom Descendants Association
</footer>


<script>

  // ============================================
  // SHOW MESSAGE
  // ============================================

  function showMessage(message) {

    const box =
      document.getElementById("loginMessage");

    box.innerText = message;

    box.style.display = "block";

  }


  // ============================================
  // CREATE NEW MEETING
  // ============================================

  function createMeeting() {

    const name =
      document
        .getElementById("participantName")
        .value
        .trim();


    if (!name) {

      showMessage(
        "Please enter your full name first."
      );

      return;

    }


    const characters =
      "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


    let meetingCode = "";


    for (
      let i = 0;
      i < 6;
      i++
    ) {

      meetingCode +=
        characters.charAt(
          Math.floor(
            Math.random() *
            characters.length
          )
        );

    }


    document
      .getElementById("meetingCode")
      .value =
      meetingCode;


    joinMeeting();

  }


  // ============================================
  // JOIN MEETING
  // ============================================

  function joinMeeting() {

    const name =
      document
        .getElementById("participantName")
        .value
        .trim();


    const meetingCode =
      document
        .getElementById("meetingCode")
        .value
        .trim()
        .toUpperCase();


    if (!name) {

      showMessage(
        "Please enter your full name."
      );

      return;

    }


    if (!meetingCode) {

      showMessage(
        "Please enter a meeting code."
      );

      return;

    }


    // Save participant name
    localStorage.setItem(
      "ikdaParticipantName",
      name
    );


    // Save meeting code
    localStorage.setItem(
      "ikdaMeetingCode",
      meetingCode
    );


    // Open meeting room
    window.location.href =
      "meeting.html?room=" +
      encodeURIComponent(
        meetingCode
      );

  }

</script>

</body>
</html>
