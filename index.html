<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>IKDA Live</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #111c33;
      padding: 25px 15px;
      text-align: center;
      border-bottom: 1px solid #263552;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      color: #b8c4d8;
    }

    .container {
      width: 92%;
      max-width: 500px;
      margin: 40px auto;
    }

    .card {
      background: #111c33;
      border: 1px solid #263552;
      border-radius: 20px;
      padding: 25px;
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    label {
      display: block;
      margin: 18px 0 7px;
      color: #c8d2e3;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #3a4b69;
      background: #182640;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #4da3ff;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1976d2;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .create {
      background: #2e7d32;
    }

    .divider {
      text-align: center;
      margin: 20px 0;
      color: #8492a8;
    }

    .info {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #182640;
      color: #b8c4d8;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<header>
  <h1>IKDA LIVE</h1>
  <p>Igala Kingdom Descendants Association</p>
</header>

<div class="container">

  <div class="card">

    <h2>Join IKDA Live</h2>

    <label for="name">
      Your Name
    </label>

    <input
      id="name"
      type="text"
      placeholder="Enter your name"
      autocomplete="name"
    >

    <label for="meetingCode">
      Meeting Code
    </label>

    <input
      id="meetingCode"
      type="text"
      placeholder="Example: IKDA2026"
      maxlength="20"
    >

    <button
      class="create"
      id="createBtn"
    >
      Create New Meeting
    </button>

    <div class="divider">
      OR
    </div>

    <button id="joinBtn">
      Join Meeting
    </button>

    <div class="info">
      <strong>IKDA Live Audio</strong><br><br>
      Enter your name and meeting code.
      Everyone using the same meeting code
      will enter the same audio room.
    </div>

  </div>

</div>

<script>

const nameInput =
  document.getElementById("name");

const codeInput =
  document.getElementById("meetingCode");

const createBtn =
  document.getElementById("createBtn");

const joinBtn =
  document.getElementById("joinBtn");


/* Generate meeting code */

function generateMeetingCode() {

  const characters =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";

  for (let i = 0; i < 6; i++) {

    code += characters.charAt(
      Math.floor(
        Math.random() * characters.length
      )
    );

  }

  return code;

}


/* Save user information */

function saveUser() {

  const name =
    nameInput.value.trim();

  const code =
    codeInput.value.trim().toUpperCase();

  if (!name) {

    alert("Please enter your name.");

    return null;

  }

  if (!code) {

    alert("Please enter a meeting code.");

    return null;

  }

  localStorage.setItem(
    "ikdaParticipantName",
    name
  );

  localStorage.setItem(
    "ikdaMeetingCode",
    code
  );

  return code;

}


/* Create meeting */

createBtn.addEventListener(
  "click",
  () => {

    const name =
      nameInput.value.trim();

    if (!name) {

      alert("Please enter your name.");

      return;

    }

    const code =
      generateMeetingCode();

    nameInput.value =
      name;

    codeInput.value =
      code;

    localStorage.setItem(
      "ikdaParticipantName",
      name
    );

    localStorage.setItem(
      "ikdaMeetingCode",
      code
    );

    window.location.href =
      "meeting.html?room=" +
      encodeURIComponent(code);

  }
);


/* Join existing meeting */

joinBtn.addEventListener(
  "click",
  () => {

    const code =
      saveUser();

    if (!code) return;

    window.location.href =
      "meeting.html?room=" +
      encodeURIComponent(code);

  }
);

</script>

</body>
</html>
