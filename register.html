<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | IKDA LIVE</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0d3b2a, #155c40);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-box {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,.25);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #d4af37;
            color: #0d3b2a;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            color: #0d3b2a;
            margin-top: 12px;
        }

        .subtitle {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5ddd8;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            border-color: #0d3b2a;
        }

        .terms {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            margin: 15px 0;
            font-size: 12px;
            color: #666;
        }

        .terms input {
            width: auto;
            margin-top: 2px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #d4af37;
            color: #0d3b2a;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #efc94c;
        }

        .bottom-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }

        .bottom-text a {
            color: #0d3b2a;
            font-weight: bold;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #0d3b2a;
            text-decoration: none;
            font-size: 13px;
        }

        #message {
            display: none;
            margin-bottom: 15px;
            padding: 11px;
            border-radius: 7px;
            font-size: 13px;
        }

        .success {
            background: #e8f6ee;
            color: #168044;
        }

        .error {
            background: #fdecec;
            color: #b42318;
        }
    </style>
</head>

<body>

<div class="register-box">

    <div class="logo">

        <div class="logo-icon">
            IK
        </div>

        <h1>IKDA LIVE</h1>

        <p class="subtitle">
            Igala Kingdom Descendant Association
        </p>

    </div>


    <div id="message"></div>


    <form id="registerForm">

        <div class="form-group">

            <label>
                Full Name
            </label>

            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter phone number"
                required
            >

        </div>


        <div class="form-group">

            <label>
                State
            </label>

            <select id="state" required>

                <option value="">
                    Select State
                </option>

                <option>Kogi</option>
                <option>Benue</option>
                <option>Enugu</option>
                <option>Nasarawa</option>
                <option>FCT Abuja</option>
                <option>Other</option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Local Government Area
            </label>

            <select id="lga" required>

                <option value="">
                    Select LGA
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create password"
                minlength="6"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required
            >

        </div>


        <div class="terms">

            <input
                type="checkbox"
                id="terms"
                required
            >

            <span>
                I agree to the IKDA LIVE terms and conditions.
            </span>

        </div>


        <button type="submit">
            Create Account & Join Meeting
        </button>

    </form>


    <p class="bottom-text">

        Already have an account?

        <a href="login.html">
            Sign In
        </a>

    </p>


    <a href="index.html" class="back">
        ← Back to IKDA LIVE
    </a>

</div>


<script>

/* ================= LGA DATA ================= */

const lgas = {

    Kogi: [
        "Adavi",
        "Ajaokuta",
        "Ankpa",
        "Bassa",
        "Dekina",
        "Ibaji",
        "Idah",
        "Igalamela-Odolu",
        "Ijumu",
        "Kabba-Bunu",
        "Lokoja",
        "Ofu",
        "Ogori-Magongo",
        "Okehi",
        "Okene",
        "Olamaboro",
        "Omala",
        "Yagba East",
        "Yagba West"
    ],

    Benue: [
        "Ado",
        "Agatu",
        "Apa",
        "Buruku",
        "Gboko",
        "Guma",
        "Gwer East",
        "Gwer West",
        "Katsina-Ala",
        "Konshisha",
        "Kwande",
        "Logo",
        "Makurdi",
        "Obi",
        "Ogbadibo",
        "Ohimini",
        "Oju",
        "Okpokwu",
        "Otukpo",
        "Tarka",
        "Ukum",
        "Ushongo",
        "Vandeikya"
    ],

    Enugu: [
        "Aninri",
        "Awgu",
        "Enugu East",
        "Enugu North",
        "Enugu South",
        "Ezeagu",
        "Igbo-Etiti",
        "Igbo-Eze North",
        "Igbo-Eze South",
        "Isi-Uzo",
        "Nkanu East",
        "Nkanu West",
        "Nsukka",
        "Oji River",
        "Udenu",
        "Udi",
        "Uzo-Uwani"
    ],

    Nasarawa: [
        "Akwanga",
        "Awe",
        "Doma",
        "Karu",
        "Keana",
        "Keffi",
        "Kokona",
        "Lafia",
        "Nasarawa",
        "Nasarawa Eggon",
        "Obi",
        "Toto",
        "Wamba"
    ],

    "FCT Abuja": [
        "Abaji",
        "Bwari",
        "Gwagwalada",
        "Kuje",
        "Kwali",
        "Municipal Area Council"
    ],

    Other: [
        "Other"
    ]
};


/* ================= STATE → LGA ================= */

document
    .getElementById("state")
    .addEventListener("change", function () {

        const state =
            this.value;

        const lga =
            document.getElementById("lga");

        lga.innerHTML =
            '<option value="">Select LGA</option>';

        if (!lgas[state]) return;

        lgas[state].forEach(function (name) {

            const option =
                document.createElement("option");

            option.value = name;
            option.textContent = name;

            lga.appendChild(option);

        });

    });


/* ================= REGISTER ================= */

document
    .getElementById("registerForm")
    .addEventListener("submit", function (event) {

        event.preventDefault();


        const fullName =
            document.getElementById("fullName").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const state =
            document.getElementById("state").value;

        const lga =
            document.getElementById("lga").value;

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        const message =
            document.getElementById("message");


        if (password.length < 6) {

            message.className = "error";
            message.style.display = "block";

            message.textContent =
                "Password must be at least 6 characters.";

            return;
        }


        if (password !== confirmPassword) {

            message.className = "error";
            message.style.display = "block";

            message.textContent =
                "Passwords do not match.";

            return;
        }


        /*
         * Demo registration.
         *
         * Later this section will call
         * Supabase Authentication.
         */

        localStorage.setItem(
            "ikdaUser",
            JSON.stringify({
                fullName,
                email,
                phone,
                state,
                lga
            })
        );


        message.className = "success";
        message.style.display = "block";

        message.textContent =
            "Registration successful! Entering the meeting...";


        /*
         * AUTOMATICALLY GO TO MEETING
         */

        setTimeout(function () {

            window.location.href =
                "meeting.html";

        }, 1000);

    });

</script>

</body>
</html>
