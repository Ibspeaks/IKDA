<script>
const form = document.getElementById("registerForm");
const message = document.getElementById("message");

form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const state = document.getElementById("state").value;
    const lga = document.getElementById("lga").value;
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (!fullName || !email || !phone || !state || !lga || !password) {
        message.textContent = "Please complete all required fields.";
        return;
    }

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
    }

    if (password.length < 6) {
        message.textContent = "Password must be at least 6 characters.";
        return;
    }

    message.textContent = "Creating your IKDA account...";

    try {
        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    full_name: fullName,
                    phone: phone,
                    state: state,
                    lga: lga
                }
            }
        });

        if (error) {
            throw error;
        }

        message.textContent = "Account created successfully!";

        // Store basic information locally for the current website session
        localStorage.setItem("ikdaUser", JSON.stringify({
            fullName: fullName,
            email: email,
            phone: phone,
            state: state,
            lga: lga
        }));

        setTimeout(() => {
            window.location.href = "meeting.html";
        }, 1000);

    } catch (error) {
        console.error(error);
        message.textContent = error.message || "Registration failed.";
    }
});
</script>
