<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Member Login | IKDA LIVE</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    color: white;
    background: #061b14;
}

.container {
    width: 100%;
    max-width: 430px;
    padding: 30px;
    background: #0d2b20;
    border: 1px solid #c8a64b;
    border-radius: 16px;
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    color: #e6c45a;
}

.subtitle {
    text-align: center;
    color: #ddd;
    line-height: 1.6;
}

h2 {
    text-align: center;
    color: #e6c45a;
    margin-top: 28px;
}

label {
    display: block;
    margin: 18px 0 7px;
}

input {
    width: 100%;
    padding: 13px;
    border-radius: 7px;
    border: 1px solid #48695b;
    background: #071e16;
    color: white;
    font-size: 16px;
}

.password-row {
    display: flex;
    gap: 8px;
}

.password-row input {
    flex: 1;
    min-width: 0;
}

.password-row button {
    width: auto;
    margin-top: 0;
    padding: 0 12px;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 7px;
    background: #d6b449;
    color: #092016;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

.message {
    margin-top: 17px;
    text-align: center;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.links {
    text-align: center;
    margin-top: 20px;
    line-height: 2;
}

a {
    color: #e6c45a;
}

.small {
    text-align: center;
    color: #b8c7bf;
    font-size: 12px;
    margin-top: 22px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">IKDA LIVE</div>

    <div class="subtitle">
        Igala Kingdom Descendant Association<br>
        Peace and Unity
    </div>

    <h2>Member Sign In</h2>

    <form id="loginForm">

        <label for="email">Email Address</label>
        <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="Enter your registered email"
            required
        >

        <label for="password">Password</label>

        <div class="password-row">
            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
            >

            <button
                type="button"
                id="togglePassword"
                aria-label="Show password"
            >Show</button>
        </div>

        <button type="submit" id="loginButton">
            Sign In & Join Meeting
        </button>

        <div
            class="message"
            id="message"
            role="status"
            aria-live="polite"
        ></div>

    </form>

    <div class="links">
        Don't have an account?
        <a href="register.html">Register here</a>
        <br>
        <a href="index.html">Return to Home</a>
    </div>

    <div class="small">
        Secure member access · IKDA LIVE
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", function () {
    const showing = passwordInput.type === "text";

    passwordInput.type = showing ? "password" : "text";
    togglePassword.textContent = showing ? "Show" : "Hide";
    togglePassword.setAttribute(
        "aria-label",
        showing ? "Show password" : "Hide password"
    );
});

form.addEventListener("submit", async function (event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
        message.textContent = "Enter your email and password.";
        return;
    }

    let client;

    if (typeof supabaseClient !== "undefined") {
        client = supabaseClient;
    } else if (window.supabaseClient) {
        client = window.supabaseClient;
    }

    if (!client) {
        message.textContent =
            "Supabase did not load. Please check supabase.js.";
        return;
    }

    button.disabled = true;
    button.textContent = "Signing in...";
    message.textContent = "Verifying your account...";

    try {
        const { data, error } = await client.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            throw error;
        }

        if (!data.session) {
            throw new Error(
                "No active session was created. Please try again."
            );
        }

        message.textContent = "Login successful! Opening IKDA LIVE...";

        localStorage.setItem("ikdaLoggedIn", "true");

        setTimeout(function () {
            window.location.href = "meeting.html";
        }, 800);

    } catch (error) {
        console.error("IKDA login error:", error);

        if (error.message.toLowerCase().includes("email not confirmed")) {
            message.textContent =
                "Please confirm your email before signing in.";
        } else {
            message.textContent =
                error.message || "Login failed. Please try again.";
        }

        button.disabled = false;
        button.textContent = "Sign In & Join Meeting";
    }
});
</script>

</body>
</html>
