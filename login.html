<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IKDA LIVE - Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(212, 175, 55, 0.12), transparent 35%),
        #06140f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-circle {
      width: 75px;
      height: 75px;
      margin: auto;
      border-radius: 50%;
      background: linear-gradient(135deg, #d4af37, #8f7115);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #06140f;
      font-size: 25px;
      font-weight: bold;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
    }

    .logo h1 {
      margin-top: 12px;
      color: #d4af37;
      font-size: 28px;
    }

    .logo p {
      color: #a9b8b2;
      margin-top: 5px;
      font-size: 14px;
    }

    .card {
      background: #0c211a;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 18px;
      padding: 30px 25px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .card h2 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #91a29b;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #d9e2de;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #28473b;
      background: #071812;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.1);
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 60px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #d4af37;
      cursor: pointer;
      font-size: 13px;
    }

    .forgot {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 20px;
    }

    .forgot a {
      color: #d4af37;
      text-decoration: none;
      font-size: 13px;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #d4af37, #b58e20);
      color: #071812;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 25px 0;
      color: #65766f;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #28473b;
      flex: 1;
    }

    .register {
      text-align: center;
      color: #91a29b;
      font-size: 14px;
    }

    .register a {
      color: #d4af37;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      text-align: center;
      margin-top: 20px;
    }

    .back a {
      color: #91a29b;
      text-decoration: none;
      font-size: 13px;
    }

    .message {
      display: none;
      margin-bottom: 15px;
      padding: 11px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      background: rgba(212, 175, 55, 0.1);
      color: #d4af37;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <div class="logo-circle">IKDA</div>
      <h1>IKDA LIVE</h1>
      <p>Igala Kingdom Descendant Association</p>
    </div>

    <div class="card">

      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to join IKDA Live meetings</p>

      <div class="message" id="message"></div>

      <form id="loginForm">

        <div class="input-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="input-group">
          <label for="password">Password</label>

          <div class="password-box">
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            >

            <button
              type="button"
              class="show-password"
              onclick="togglePassword()"
            >
              Show
            </button>
          </div>
        </div>

        <div class="forgot">
          <a href="#">Forgot password?</a>
        </div>

        <button class="login-btn" type="submit">
          Sign In
        </button>

      </form>

      <div class="divider">OR</div>

      <div class="register">
        Don't have an account?
        <a href="register.html">Create Account</a>
      </div>

    </div>

    <div class="back">
      <a href="index.html">← Back to IKDA LIVE</a>
    </div>

  </div>

  <script>

    function togglePassword() {
      const password = document.getElementById("password");
      const button = document.querySelector(".show-password");

      if (password.type === "password") {
        password.type = "text";
        button.textContent = "Hide";
      } else {
        password.type = "password";
        button.textContent = "Show";
      }
    }

    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const message = document.getElementById("message");

      message.style.display = "block";
      message.textContent = "Demo login successful. Connecting to IKDA LIVE...";

      setTimeout(() => {
        window.location.href = "join.html";
      }, 1200);
    });

  </script>

</body>
</html>
